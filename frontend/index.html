<!DOCTYPE html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a0e" />

    <!-- PWA: iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flotia" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA: Android / General -->
    <link rel="manifest" href="/manifest.json" />

    <!-- El SVG es la fuente del logo; el PNG queda para los navegadores que no
         lo leen. Los dos salen de scripts/generar-iconos.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- SEO. Sin canonical ni og:url escritos: el dominio es el de cada
         despliegue, y una URL de otro dominio aquí le diría a Google que esta
         página es otra. -->
    <title>Flotia — Gestión de flotas con IA</title>
    <meta name="description" content="Inspecciones con foto e IA de daños, taller y órdenes de reparación, vencimientos, cuadrante y equipo. El panel de operaciones para empresas con vehículos." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flotia" />
    <meta property="og:title" content="Flotia — Gestión de flotas con IA" />
    <meta property="og:description" content="Inspecciones con foto e IA de daños, taller, vencimientos y el día de tu flota en un solo panel." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Flotia — Gestión de flotas con IA" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Red de seguridad por DEBAJO del bundle: si el propio index-<hash>.js
         llega envenenado (MIME text/html tras un deploy), main.jsx no se
         ejecuta y con él se caen sus tres defensas. Este script es clásico y
         externo a propósito: la CSP no admite inline. Va ANTES del módulo para
         estar ya armado si el módulo ni siquiera carga. -->
    <script src="/arranque.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
