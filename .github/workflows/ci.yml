name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (build + checkers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: ESLint (errores de React, hooks, variables inexistentes)
        working-directory: frontend
        run: npm run lint
      - name: Build de producción
        working-directory: frontend
        run: npm run build
      - name: Instalar navegador para las pruebas
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Pruebas E2E (humo de 44 pantallas + barrido de botones, escritorio y movil)
        working-directory: frontend
        run: npm run e2e
      - name: Checker i18n (claves faltantes/duplicadas)
        run: node scripts/check-i18n.mjs
      - name: Checker rutas backend (duplicados)
        run: node scripts/check-routes.mjs
      - name: Checker rutas sin consumidor (huerfanas)
        run: node scripts/check-huerfanas.mjs
      - name: Checker permisos (pantallas que nadie puede conceder)
        run: node scripts/check-permisos.mjs
      - name: Checker tema (el hibrido tiene que seguir al modo dia)
        run: node scripts/check-tema.mjs
      - name: Checker ayuda (pantallas que no se explican)
        run: node scripts/check-ayuda.mjs
      - name: Checker contraste (texto que no se lee)
        run: node scripts/check-contraste.mjs
      - name: Checker tema mezclado (componente oscuro en pantalla clara)
        run: node scripts/check-tema-mezclado.mjs
      - name: useEffect que devuelve algo (revienta AL SALIR de la pantalla)
        run: node scripts/check-efectos.mjs
      - name: Chunk roto reconocido en todos los navegadores (si no, el usuario no se cura)
        run: node scripts/check-chunk-error.mjs
      - name: Mensajes de error (siempre texto, nunca un objeto que tumbe la pantalla)
        run: node scripts/check-detalle-error.mjs
      - name: Envio de una candidatura (se reintenta, y reintentarlo es seguro)
        run: node scripts/check-envio-candidatura.mjs
      - name: Leer una etiqueta en cada pais (telefono, calle y CP de cada sitio)
        run: node scripts/check-leer-etiqueta.mjs
      - name: Escanear el 2D de la etiqueta (SEUR/DPD, GLS, GS1) mete la parada sola
        run: node scripts/check-escaneo-2d.mjs
      - name: Modulos por empresa (el menu y el catalogo cuadran)
        run: node scripts/check-modulos.mjs
      - name: Aviso de version nueva (no salta sin version nueva ni encadena recargas)
        run: node scripts/check-version-app.mjs
      - name: Checker patrones (codigo que repite un bug ya conocido)
        run: node scripts/check-patrones.mjs
      - name: Lo importado existe (nombre o fichero borrado que alguien sigue importando)
        run: node scripts/check-existe.mjs
      - name: Ficheros huerfanos (codigo al que no llega nadie desde la entrada)
        run: node scripts/check-huerfanos.mjs
      - name: Todo lo usado esta importado
        run: node scripts/check-importados.mjs
      - name: Clases de Tailwind que no existen (se pintan sin estilo, sin error)
        run: node scripts/check-clases-fantasma.mjs
      - name: Hooks detras de un return (revienta al cambiar de estado)
        run: node scripts/check-hooks.mjs
      - name: Tests que nunca se ejecutan
        run: node scripts/check-tests-huerfanos.mjs
      - name: Ningun texto visible nombra otra plataforma ni la marca escrita a mano
        run: node scripts/check-marca.mjs
      - name: Las promociones tienen una sola fecha y un solo importe (servidor = web)
        run: node scripts/check-promo.mjs

  backend:
    name: Backend (sintaxis + contratos + tests de API)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Sintaxis (py_compile)
        run: python -m py_compile backend/server.py backend/ai_learning.py backend/damage_segmentation.py
      - name: Contratos modelo↔frontend (campos que se descartarían en silencio)
        run: python scripts/check_contracts.py
      - name: ObjectId en la respuesta (500 solo la primera vez, luego funciona)
        run: python scripts/check_objectid.py
      - name: Multi-tenant (endpoint sin sesión que escribiría en la empresa que no es)
        run: python scripts/check_tenant.py
      - name: Multiempresa (un centro de la principal decidiendo por los demas)
        run: python scripts/check_multiempresa.py
      - name: Borrado masivo (vaciar una coleccion sin super-admin, confirmacion y rastro)
        run: python scripts/check_borrado.py
      - name: Unicos (except DuplicateKeyError sin indice unico detras)
        run: python scripts/check_unicos.py
      - name: Cuerpos (leer el cuerpo de una peticion sin sus ayudantes = 500)
        run: python scripts/check_cuerpos.py
      - name: Rutas tapadas (una ruta que otra declarada antes no deja llegar)
        run: python scripts/check_rutas_tapadas.py
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - name: Tests de API contra Mongo real (persistencia, auth, demo read-only)
        env:
          SECRET_KEY: test-secret-key-only-for-tests
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: test_flota
          GLOBAL_DB_NAME: test_flota_global
        run: pytest backend/tests -q
      # Lo que la app nativa de Android le pide al servidor, contra el server.py real con una base en memoria:
      # acceso unificado y destino, turnos, trabajar más, auditoría, referidos, cuenta, y la ruta del autónomo.
      # Hasta el 29-10-2026 esto solo se pasaba a mano en el PC: un cambio en una ruta podía dejar la app de Play
      # sin entrar y el CI en verde.
      - name: Contrato app Android ↔ API (las llamadas de FDS contra el servidor real en memoria)
        run: |
          python app-android/pruebas/servidor_pruebas.py > servidor_pruebas.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/health > /dev/null && break; sleep 1; done
          python app-android/pruebas/api_conductor.py || { tail -20 servidor_pruebas.log; exit 1; }

  android:
    name: App Android (compila y pasa sus tests unitarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Hasta el 29-10-2026 la app solo se compilaba en el PC de Dani: un cambio en Kotlin que no compilaba no lo
      # paraba nadie hasta el siguiente `gradlew`. Aquí se compila la variante de depuración (sin la clave de
      # firma, que no está en el repositorio) y se pasan los tests unitarios (LectorEtiquetaTest).
      - name: Compilar la app y pasar sus tests unitarios
        working-directory: app-android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug
