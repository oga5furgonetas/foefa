# LA APP DE IPHONE, HECHA POR GITHUB (30-10-2026, Dani: «cómo hacemos ahora para ponerla en Apple… móntala»).
# Es la misma web (frontend/) envuelta con Capacitor (frontend/ios/): desde Windows no se puede compilar para iPhone,
# así que la compila un Mac de GitHub. Dos partes:
#   1. SIEMPRE: compila para el simulador, sin firma. Si esto está en verde, el proyecto de Xcode está bien.
#   2. CON LOS SECRETOS DE APPLE (Settings → Secrets and variables → Actions): archiva, firma y SUBE a App Store Connect
#      (sale en TestFlight y, desde ahí, se manda a revisión en appstoreconnect.apple.com). Hacen falta:
#        APPLE_TEAM_ID        el Team ID de la cuenta de desarrollador (developer.apple.com → Membership, 10 letras)
#        ASC_KEY_ID           el Key ID de una clave de la API de App Store Connect (Users and Access → Integrations)
#        ASC_ISSUER_ID        el Issuer ID de esa misma pantalla
#        ASC_API_KEY_P8       el contenido entero del fichero AuthKey_XXXX.p8 (solo se puede bajar una vez)
#      Con la clave, Xcode crea y renueva él solo los certificados y perfiles (cloud signing): no hay que subir nada más.
# Se lanza a mano (Run workflow) o al tocar frontend/ (sin los tests) o este fichero en main. Los pasos de Dani están
# en docs/APP_STORE.md.
name: App iPhone (App Store)

on:
  workflow_dispatch:
    inputs:
      subir:
        description: "Subir a App Store Connect (si hay secretos)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['frontend/ios/**', 'frontend/capacitor.config.json', 'frontend/src/**', 'frontend/public/**', 'frontend/package.json', '.github/workflows/app-ios.yml']

concurrency:
  group: app-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iphone:
    name: Compilar (y subir a Apple si hay clave)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_VERSION: "2.4.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: La web, apuntando a la API de producción
        working-directory: frontend
        env:
          VITE_API_URL: https://flota-backend.fly.dev/api
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: CocoaPods
        working-directory: frontend/ios/App
        run: pod install
      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
      - name: "1. Compila para el simulador (sin firma): el proyecto está bien"
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/build/sim" \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tail -40
      # Dani no tiene iPhone (30-10-2026): el Mac arranca la app en un simulador de iPhone y guarda lo que se ve al abrirla
      # (artefacto «iphone-simulador»). Si la pantalla sale, la app de verdad abre; lo que no se prueba aquí son la cámara
      # y la ubicación, que el simulador no tiene.
      - name: "1b. La arranca en un simulador de iPhone y guarda la pantalla"
        working-directory: frontend/ios/App
        run: |
          APP=$(find "$PWD/build/sim/Build/Products" -name "App.app" -maxdepth 2 | head -1)
          echo "app: $APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ds=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'] in ('iPhone 16 Pro Max','iPhone 16 Pro','iPhone 16','iPhone 15 Pro','iPhone 15')]; print(ds[0]['udid'] if ds else '')")
          [ -n "$UDID" ] || { echo "sin simulador de iPhone disponible"; xcrun simctl list devices available | head -30; exit 0; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.flotadsp.fds
          sleep 12
          mkdir -p "$PWD/build/capturas"
          xcrun simctl io "$UDID" screenshot "$PWD/build/capturas/iphone-arranque.png"
          sleep 6
          xcrun simctl io "$UDID" screenshot "$PWD/build/capturas/iphone-arranque-2.png"
          xcrun simctl shutdown "$UDID" || true
          ls -la "$PWD/build/capturas"
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-simulador
          path: frontend/ios/App/build/capturas/
          if-no-files-found: ignore
          retention-days: 30
      - name: ¿Hay clave de Apple?
        id: apple
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
          SUBIR: ${{ github.event_name == 'push' || inputs.subir }}
        run: |
          if [ -n "$TEAM" ] && [ -n "$KEY" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] && [ "$SUBIR" = "true" ]; then
            echo "si=true" >> "$GITHUB_OUTPUT"; echo "Con clave: se archiva, se firma y se sube."
          else
            echo "si=false" >> "$GITHUB_OUTPUT"; echo "Sin clave de Apple (o sin pedir subir): solo se comprueba que compila."
          fi
      # FIRMA MANUAL (30-10-2026): sin un iPhone registrado, la firma automática no puede archivar (pide un perfil de
      # desarrollo: runs 41088867006 y 41091300681). El certificado «Apple Distribution» y el perfil «FDS App Store» se
      # hicieron con la clave de la API desde el PC (`scripts/app_store_connect.py certificado` y `perfil`) y viven en los
      # secretos IOS_DIST_P12_B64, IOS_DIST_P12_PASSWORD e IOS_PROFILE_B64; el target App lleva en Release
      # CODE_SIGN_STYLE=Manual con ese perfil (project.pbxproj). Caducan el 30-10-2027: entonces, `perfil` otra vez.
      - name: "2. Archiva, firma y sube a App Store Connect"
        if: steps.apple.outputs.si == 'true'
        working-directory: frontend/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_API_KEY_P8 }}
          P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          set -o pipefail
          [ -n "$P12_B64" ] && [ -n "$P12_PASSWORD" ] && [ -n "$PROFILE_B64" ] || { echo "faltan IOS_DIST_P12_B64 / IOS_DIST_P12_PASSWORD / IOS_PROFILE_B64 (ver docs/APP_STORE.md)"; exit 1; }
          mkdir -p "$HOME/.private_keys"
          printf '%s\n' "$P8" > "$HOME/.private_keys/AuthKey_$KEY.p8"
          # El certificado, en un llavero propio del runner; el perfil, donde Xcode lo busca.
          KEYCHAIN="$RUNNER_TEMP/fds.keychain-db"
          security create-keychain -p fds "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p fds "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k fds "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN" | head -3
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/fds-app-store.mobileprovision"
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.flotadsp.fds</key><string>FDS App Store</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive | tail -40
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.private_keys/AuthKey_$KEY.p8" -authenticationKeyID "$KEY" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "Subida a App Store Connect: FDS $APP_VERSION (build ${{ github.run_number }}). En unos minutos sale en TestFlight."
      - name: Borrar la clave del runner
        if: always()
        run: rm -rf "$HOME/.private_keys"
