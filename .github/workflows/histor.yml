name: Histor

# Solo se ejecuta cuando cambia el periódico (histor/); no toca el CI de Flota.
on:
  push:
    branches: [main]
    paths: ['histor/**', '.github/workflows/histor.yml']
  pull_request:
    paths: ['histor/**', '.github/workflows/histor.yml']

concurrency:
  group: histor-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: histor

jobs:
  test:
    name: Tipos, lint, pruebas, build y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: histor
          POSTGRES_PASSWORD: histor
          POSTGRES_DB: histor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U histor" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_DATABASE_URL: postgres://histor:histor@localhost:5432/histor_test
      WORKER_TEST_DATABASE_URL: postgres://histor:histor@localhost:5432/histor_worker_test
      E2E_DATABASE_URL: postgres://histor:histor@localhost:5432/histor_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: histor/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Sin secretos en el repositorio
        run: node scripts/check-secrets.mjs
      - name: Tipos (núcleo, web y worker)
        run: npm run typecheck
      - name: ESLint (web)
        run: npm run lint -w @histor/web
      - name: Pruebas del núcleo (unitarias, adversarias y de integración con Postgres)
        run: npm test -w @histor/core
      - name: Pruebas del worker
        run: npm test -w @histor/worker
      - name: Build de producción (web y worker)
        run: npm run build
      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium
        working-directory: histor/apps/web
      - name: E2E (escritorio y móvil, escenario DEMO)
        run: npx playwright test
        working-directory: histor/apps/web
      - name: Informe de E2E si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: histor-playwright
          path: histor/apps/web/test-results
          retention-days: 7

  docker:
    name: Imágenes Docker (web y worker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Web
        run: docker build --target web -t histor-web .
      - name: Worker
        run: docker build --target worker -t histor-worker .
