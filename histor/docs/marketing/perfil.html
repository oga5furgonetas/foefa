<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'News'; src: url('FONT_SERIF') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Sans'; src: url('FONT_SANS') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); }
  body { background: #fbfaf7; color: #15171c; font-family: 'News', Georgia, serif; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  /* Foto de perfil: «H.» grande (Facebook la recorta en círculo). */
  .mark { font-weight: 800; font-variation-settings: 'opsz' 72; font-size: 620px; letter-spacing: -0.04em; line-height: 1; margin-top: -40px; }
  .dot { color: #b3261e; }
  /* Portada: cabecera completa con su lema entre filetes. */
  /* Arriba: en Facebook la foto de perfil tapa el centro de la parte baja de la portada. */
  .cover { text-align: center; margin-bottom: 170px; }
  .cover .word { font-weight: 800; font-variation-settings: 'opsz' 72; font-size: 210px; letter-spacing: -0.035em; line-height: 0.9; }
  .cover .tag { font-family: 'Sans'; font-weight: 600; font-size: 30px; letter-spacing: 0.24em; text-transform: uppercase; color: #5d6270; margin-top: 26px; padding-top: 18px; border-top: 2px solid #15171c; }
</style>
</head>
<body>
BODY
</body>
</html>
